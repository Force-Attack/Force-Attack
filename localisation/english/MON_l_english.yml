 # ========================
 # CAPSTONE TOOLTIPS
 # ========================

 MON_legacy_capstone_tt:0 "All Mongolian infantry and cavalry divisions receive a permanent attack and defense bonus. Mongol generals gain additional traits."

 MON_iron_horde_capstone_tt:0 "All Mongolian armored and mechanized divisions receive a permanent attack and breakthrough bonus. Unlocks the 'Iron Horde' division template."

  MON_industrial_heartland_idea:0 "Industrial Heartland"
 MON_industrial_heartland_idea_desc:0 "A concentrated cluster of mines, foundries and factories has taken root in the Mongolian heartland. Raw materials flow in from the surrounding steppe and finished industrial products flow out to every corner of the country. The engine of Mongolian industry has been built and it is running ahead of every projection the planning committee dared to write down."

 MON_industrial_revolution_idea:0 "Mongolian Industrial Revolution"
 MON_industrial_revolution_idea_desc:0 "What took Europe a century Mongolia has compressed into a decade. Factories that did not exist ten years ago are now running three shifts. Engineers who had never seen a lathe are now training the next generation of Mongolian machinists. The industrial revolution has arrived on the steppe and it shows no sign of slowing down."

 MON_national_construction_idea:0 "National Construction Program"
 MON_national_construction_idea_desc:0 "Every available builder, engineer and labourer in Mongolia has been mobilised behind a single coordinated construction effort. Scaffolding rises across every major city. New roads push into regions that have never seen a paved surface. Factory walls go up faster than the planners can update their maps. Mongolia is building itself into the modern world one brick at a time."

 MON_worker_training_idea:0 "Worker Training Program"
 MON_worker_training_idea_desc:0 "Mongolia's factories are only as capable as the workers inside them and those workers are becoming more capable every month. The national training program has produced a generation of skilled machinists, technicians and factory managers who understand their equipment, maintain it properly and push it to its maximum output. Mongolian industry is no longer learning. It is performing."

 MON_radio_propaganda_idea:0 "National Radio Broadcasting"
 MON_radio_propaganda_idea_desc:0 "The voice of the Mongolian state now reaches every corner of the country. Morning broadcasts carry news, government announcements and cultural programming to settlements that have never before been connected to the national conversation. The population feels more unified, more informed and more confident in the direction the country is heading. The radio has done more for Mongolian national identity than any political speech ever managed."

 MON_electronics_revolution_idea:0 "Electronics Revolution"
 MON_electronics_revolution_idea_desc:0 "Mongolia's investment in electronics research is beginning to pay dividends that go far beyond the electronics sector itself. The rigorous scientific thinking demanded by electronics work is spreading into every other area of Mongolian research and industry. Problems that once took months to solve are being cracked in weeks. Equipment that once had to be imported is being designed and built in Ulaanbaatar. Mongolia is thinking faster than it ever has before."

 MON_economic_miracle_idea:0 "The Mongolian Economic Miracle"
 MON_economic_miracle_idea_desc:0 "The transformation of the Mongolian economy from pastoral subsistence to modern industrial powerhouse has been completed at a speed that has astonished every foreign observer who has visited the country. Factories hum, railways carry freight around the clock, electronics laboratories produce equipment that rivals anything manufactured in Asia and the University of Ulaanbaatar is producing graduates that the great powers are quietly trying to recruit. Mongolia has done what nobody believed possible. It has done it on its own terms and it is not finished yet."

  # Root
 MON_visit_to_moscow:0 "The Visit to Moscow"
 MON_visit_to_moscow_desc:0 "Prime Minister Genden has returned from Moscow. The meeting with Stalin was difficult. The Soviet leader made clear his expectations for Mongolia — closer alignment, tighter control and the removal of elements he considers unreliable. Genden has said little about what was discussed. The party is watching him carefully. The Soviets are watching everyone. Mongolia stands at a crossroads and the path chosen in the coming months will define the nation for a generation."

 # Path choices
 MON_accept_soviet_guidance:0 "Accept Soviet Guidance"
 MON_accept_soviet_guidance_desc:0 "Moscow has spoken and Mongolia will listen. The Soviet Union is our protector, our model and our senior partner. Whatever reservations some in the party may have about the pace and nature of Soviet demands, the reality is simple — without Soviet support Mongolia cannot survive between the USSR and Imperial Japan. We shall align ourselves fully with Moscow and trust that our loyalty will be rewarded."

 MON_resist_soviet_pressure:0 "Resist Soviet Pressure"
 MON_resist_soviet_pressure_desc:0 "Genden did not go to Moscow to be lectured. Mongolia is not a Soviet province. We are a sovereign nation with our own party, our own people and our own communist path. We shall maintain our socialist identity while refusing to be absorbed into the Soviet orbit entirely. It will make enemies in Moscow. Those enemies were already there."

 MON_reach_out_to_the_west:0 "Reach Out to the West"
 MON_reach_out_to_the_west_desc:0 "The Soviet Union is not the only option. The western democracies have shown interest in Mongolian sovereignty as a counterweight to both Soviet and Japanese expansion in Asia. It is a dangerous game — Moscow will not react well and Tokyo will be suspicious. But a Mongolia with western friends is a Mongolia with options and options are the most valuable thing a small nation can possess."

 MON_mongol_national_awakening:0 "The Mongol National Awakening"
 MON_mongol_national_awakening_desc:0 "Enough. Mongolia belongs to the Mongols — not to Moscow, not to foreign ideology and not to the ghost of a Chinese empire. The great steppe was the birthplace of the largest land empire in history and those who built it were our ancestors. We shall look inward, to our own history and our own identity, and build a Mongolia that Genghis Khan himself would recognise as worthy of his legacy."

 # Path 1 — Historical
 MON_choibalsan_rises:0 "Choibalsan Rises"
 MON_choibalsan_rises_desc:0 "Khorloogiin Choibalsan has emerged as the most reliable ally of Soviet interests within the Mongolian party leadership. Ambitious, ruthless and utterly committed to the Soviet line, he is positioning himself as the natural successor to whatever authority Genden still holds. Moscow approves. Choibalsan knows that Moscow approves. He is making the most of it."

 MON_purge_the_opposition:0 "Purge the Opposition"
 MON_purge_the_opposition_desc:0 "The party has begun purging elements deemed insufficiently loyal to the Soviet line. Buddhist clergy, nationalist intellectuals and anyone associated with the old order is finding life increasingly uncomfortable. Arrests have begun. Some of those arrested are not seen again. The party grows quieter and more obedient with every passing month."

 MON_trial_of_genden:0 "The Trial of Genden"
 MON_trial_of_genden_desc:0 "Peljidiin Genden has been arrested on charges of counter-revolutionary activity, espionage and anti-Soviet behaviour. The trial is swift and the outcome is never in doubt. Genden is found guilty and executed. Mongolia has lost the last leader willing to stand up to Moscow. Choibalsan now stands at the top of an empty mountain and the Soviets are very pleased with how things have turned out."

 MON_mongolian_peoples_republic_strengthened:0 "Strengthen the People's Republic"
 MON_mongolian_peoples_republic_strengthened_desc:0 "With the opposition gone and Choibalsan in firm control, the Mongolian People's Republic is being restructured along fully Stalinist lines. The party controls everything. The party is controlled by Choibalsan. Choibalsan answers to Moscow. It is a clean and simple arrangement that leaves no room for doubt or dissent."

 MON_soviet_military_advisors:0 "Soviet Military Advisors"
 MON_soviet_military_advisors_desc:0 "Soviet military advisors have arrived in force to reshape the Mongolian army in the Red Army's image. New doctrine, new organisation and new equipment flow in from across the border. The Mongolian army is becoming, in almost every meaningful sense, an extension of Soviet military power in the east."

 MON_collectivization_of_the_herds:0 "Collectivisation of the Herds"
 MON_collectivization_of_the_herds_desc:0 "In imitation of Soviet agricultural collectivisation, Mongolia's nomadic herders are being organised into collective units. It is deeply unpopular. The herds are not the same as fields and the nomads are not the same as Russian peasants. The planning committee is discovering this the hard way. The policy continues regardless."

 MON_anti_japanese_pact_with_soviets:0 "Anti-Japanese Mutual Defence"
 MON_anti_japanese_pact_with_soviets_desc:0 "With Japan pressing aggressively in Manchuria and Inner Mongolia the threat to the Mongolian border is real and immediate. A formal mutual defence agreement with the Soviet Union guarantees that any Japanese attack on Mongolia will be met by the full weight of Soviet military power. It is the one genuine benefit of close Soviet alignment."

 MON_choibalsan_consolidates_power:0 "Choibalsan Consolidates Power"
 MON_choibalsan_consolidates_power_desc:0 "The last traces of internal opposition have been swept away. The party congress has formally elevated Choibalsan to the position of supreme leadership. His portrait joins Stalin's on the walls of every government building. Mongolia's fate is now inseparable from the Soviet Union's and Choibalsan would have it no other way."

 MON_the_little_stalin:0 "The Little Stalin"
 MON_the_little_stalin_desc:0 "Foreign observers have taken to calling Choibalsan the Little Stalin and the comparison is apt. His control over Mongolia is total, his methods are brutal and his loyalty to the real Stalin is absolute. Mongolia is stable, Soviet-aligned and entirely subservient. Whether this is a triumph or a tragedy depends entirely on who you ask — and in Mongolia you must be very careful who you ask."

 # Path 2 — Genden
 MON_genden_refuses_moscow:0 "Genden Refuses Moscow"
 MON_genden_refuses_moscow_desc:0 "Genden has made his decision. When Stalin's representatives came with their demands he listened politely and then declined. It is an act of extraordinary courage or extraordinary foolishness depending on your perspective. The Soviet advisors have left Ulaanbaatar looking very displeased. Genden has poured himself a drink and is reportedly in excellent spirits."

 MON_purge_soviet_loyalists:0 "Purge Soviet Loyalists"
 MON_purge_soviet_loyalists_desc:0 "Genden knows that Moscow has agents inside the Mongolian party and he is going to find them before they find him. A careful and targeted purge of known Soviet loyalists within the leadership has begun. It is surgical where Stalin's purges are blunt. The goal is not to terrorise the party but to make it genuinely Mongolian again."

 MON_genden_strengthens_the_party:0 "Genden Strengthens the Party"
 MON_genden_strengthens_the_party_desc:0 "With Soviet loyalists removed and his own position secured Genden has set about rebuilding the Mongolian People's Revolutionary Party as a genuinely independent communist organisation. New leadership cadres are being trained, party structures reformed and a distinct Mongolian communist identity is being carefully cultivated to replace the Soviet template imposed from outside."

 MON_mongolian_communist_identity:0 "A Mongolian Communist Identity"
 MON_mongolian_communist_identity_desc:0 "Mongolia will build socialism on its own terms. Not the Soviet model, not the Chinese model but a Mongolian model that takes account of our nomadic traditions, our geography and our history. It will be unorthodox by Moscow's standards. Genden considers that a recommendation rather than a criticism."

 MON_independent_foreign_policy:0 "An Independent Foreign Policy"
 MON_independent_foreign_policy_desc:0 "Mongolia will pursue its own foreign policy. We will not be a Soviet satellite, we will not align with Japan and we will not ask anyone's permission before talking to whoever we choose. It is a bold stance for a small landlocked nation surrounded by great powers but Genden believes that independence must be asserted or it will be taken away."

 MON_genden_economic_program:0 "The Genden Economic Program"
 MON_genden_economic_program_desc:0 "Genden has launched a distinctly Mongolian approach to socialist economic development — one that preserves the nomadic pastoral economy alongside industrial development rather than attempting to collectivise it out of existence. The herders keep their herds. The factories are built. Both can exist and both will be stronger for coexisting."

 MON_non_aligned_communist_bloc:0 "Non-Aligned Socialist Mongolia"
 MON_non_aligned_communist_bloc_desc:0 "Mongolia formally declares itself a non-aligned socialist state. We acknowledge no senior partner, no guiding ideology from abroad and no obligation to support any great power's foreign policy goals. We are communists because we chose to be not because Moscow told us to be. The distinction matters enormously."

 MON_genden_doctrine:0 "The Genden Doctrine"
 MON_genden_doctrine_desc:0 "The Genden Doctrine is now the formal ideological and political framework of the Mongolian state. Socialism with Mongolian characteristics. Independence without isolation. Strength through unity rather than fear. It is not what Marx wrote and it is certainly not what Stalin wants but it is something genuinely Mongolian and that alone makes it worth defending."

 MON_mongolian_socialist_republic:0 "The Mongolian Socialist Republic"
 MON_mongolian_socialist_republic_desc:0 "Mongolia formally reconstitutes itself as the Mongolian Socialist Republic — independent, non-aligned and fully committed to a Mongolian path to socialism. Genden stands before the party congress and receives a standing ovation that lasts considerably longer than anyone expected. Moscow has sent no congratulations. Genden has sent them no invitation."

 # Path 3 — Democratic
 MON_western_diplomatic_mission:0 "Western Diplomatic Mission"
 MON_western_diplomatic_mission_desc:0 "Mongolia has dispatched diplomatic representatives to London, Paris and Washington with a simple message — we exist, we are independent and we would very much like friends who are not the Soviet Union or Imperial Japan. The reception is cautious but not unwelcoming. The west is curious about Mongolia in the way that people are curious about something they had completely forgotten existed."

 MON_league_of_nations_application:0 "Apply to the League of Nations"
 MON_league_of_nations_application_desc:0 "Mongolia has submitted a formal application for membership of the League of Nations. It is a declaration of intent as much as a diplomatic move — Mongolia wishes to be recognised as a sovereign nation under international law with all the protections that entails. The League's record of actually protecting small nations is not encouraging but the symbolism matters."

 MON_constitutional_convention:0 "Constitutional Convention"
 MON_constitutional_convention_desc:0 "Representatives from across Mongolia have gathered in Ulaanbaatar for the first constitutional convention in the nation's history. Nomadic herders, urban workers, Buddhist clergy and western educated reformers are debating what kind of country Mongolia should be. It is chaotic, it is argumentative and it is the most genuinely democratic thing that has ever happened on the Mongolian steppe."

 MON_free_press:0 "Establish a Free Press"
 MON_free_press_desc:0 "Mongolia's first independent newspapers have begun publishing. They are small, poorly funded and printed on equipment that was old when it arrived but they are free. They print things the government does not always like. The government is learning, with some difficulty, that this is the point."

 MON_first_free_elections:0 "First Free Elections"
 MON_first_free_elections_desc:0 "Mongolia holds its first genuinely free elections. The turnout is extraordinary — Mongolians from the most remote corners of the steppe travel extraordinary distances to cast their votes. Nobody is entirely sure how the counting process works. Several candidates dispute the results. It is, by every meaningful measure, a democracy."

 MON_land_of_the_free_nomad:0 "Land of the Free Nomad"
 MON_land_of_the_free_nomad_desc:0 "The new Mongolian constitution formally enshrines the rights of the nomadic population — to move freely, to maintain their traditional way of life and to participate fully in the democratic process without abandoning their culture. Mongolia will modernise but it will do so on terms that the people of the steppe can recognise as their own."

 MON_democratic_army_reform:0 "Democratic Army Reform"
 MON_democratic_army_reform_desc:0 "The Mongolian army is being reformed to serve the democratic state rather than any particular political faction. Officers swear loyalty to the constitution rather than to any individual leader. The Soviet trained elements of the officer corps are being carefully reoriented. It is delicate work but essential — a democracy that cannot control its own army is not really a democracy."

 MON_democratic_mongolia_established:0 "Democratic Mongolia Established"
 MON_democratic_mongolia_established_desc:0 "The democratic transition is complete. Mongolia has a constitution, a freely elected parliament, an independent press and an army under civilian control. It has accomplished in a few years what took some nations centuries. The process was imperfect and the result is fragile. But it is real and it is Mongolian and those who built it are fiercely proud of what they have made."

 MON_the_mongol_republic:0 "The Mongol Republic"
 MON_the_mongol_republic_desc:0 "Mongolia formally proclaims itself the Mongol Republic — a free, democratic and sovereign nation standing on its own two feet in a world that did not expect it to manage it. The new flag flies over Ulaanbaatar. The new parliament is in session. The new president has given a speech that was simultaneously inspiring and about forty minutes too long. Democracy has come to the steppe."

 # Path 4 — Nationalist
 MON_the_great_mongol_spirit:0 "The Great Mongol Spirit"
 MON_the_great_mongol_spirit_desc:0 "There is a fire burning in Mongolia that no foreign ideology imported from Russia or the west can extinguish. It is the spirit of the great steppe, of the riders who conquered the world, of a people who built the largest empire in history and who remember it in their bones even now. We shall fan that fire into something the world will have to reckon with."

 MON_reject_foreign_ideology:0 "Reject Foreign Ideology"
 MON_reject_foreign_ideology_desc:0 "Communism came from Russia. Democracy came from Europe. Neither was asked for and neither fits. Mongolia does not need foreign ideology to tell it how to be Mongolian. We shall strip away the imported frameworks and build something rooted in our own history, our own values and our own understanding of what Mongolia is and what it is meant to be."

 MON_cult_of_genghis_khan:0 "The Cult of Genghis Khan"
 MON_cult_of_genghis_khan_desc:0 "Genghis Khan is not merely a historical figure in Mongolia — he is the soul of the nation. The Soviet-backed government suppressed his memory because they feared what it inspired. We shall restore it. His image will return to public life, his campaigns will be taught in every school and every Mongolian soldier will know the name and deeds of the greatest conqueror who ever lived."

 MON_purge_communist_influence:0 "Purge Communist Influence"
 MON_purge_communist_influence_desc:0 "The Soviet installed party apparatus, the commissars, the collective farm administrators and the ideological officers have been removed. Some have fled across the border. Others have been arrested. The Soviet embassy has filed a formal protest. The protest has been read, noted and filed in a drawer that will not be opened again."

 MON_nationalist_government:0 "Nationalist Government"
 MON_nationalist_government_desc:0 "A new Mongolian nationalist government has been formed drawing its legitimacy not from Soviet approval or western democratic theory but from Mongolian history, Mongolian culture and the will of the Mongolian people. It is authoritarian by nature — the steppe does not have much patience for parliamentary procedure — but it is genuinely and fiercely Mongolian in a way that nothing that came before it was."

 MON_greater_mongolia_irredenta:0 "Greater Mongolia"
 MON_greater_mongolia_irredenta_desc:0 "The borders of modern Mongolia are not the borders of the Mongolian people. Hundreds of thousands of Mongols live under Soviet rule in Buryatia and under Chinese rule in Inner Mongolia — cut off from the homeland by the decisions of empires that are no longer what they were. Mongolia will not forget them. Eventually Mongolia will do something about them."

 MON_the_mongol_military_state:0 "The Mongol Military State"
 MON_the_mongol_military_state_desc:0 "Mongolia is restructuring itself as a military state in the tradition of the great khans. Every resource, every institution and every citizen will be oriented toward military strength. The army is not a tool of the state — the state is a tool of the army and the army exists to restore what was taken from the Mongolian people."

 MON_buryatia_irredenta:0 "The Buryat Mongols"
 MON_buryatia_irredenta_desc:0 "The Buryat Mongols of Soviet Russia are our brothers separated from us by a border drawn by others. Buryatia is Mongol land inhabited by Mongol people who speak a Mongol language and who remember where they came from. Mongolia formally claims the Buryat territories as part of the greater Mongolian homeland. Moscow will not like this. We have factored that into our calculations."

 MON_inner_mongolia_irredenta:0 "Inner Mongolia"
 MON_inner_mongolia_irredenta_desc:0 "Inner Mongolia — that vast territory absorbed into the Chinese state — was Mongolian before it was anything else and it will be Mongolian again. The Mongols of Inner Mongolia are watching what is happening in Ulaanbaatar. We are sending them a message — we have not forgotten you and we are coming."

 MON_the_new_mongol_empire:0 "The New Mongol Empire"
 MON_the_new_mongol_empire_desc:0 "It is not an empire in the old sense — we are not so foolish as to think the world of 1936 is the world of 1206. But it is a Mongolian state that is once again the centre of the Mongolian world. Buryatia to the north, Inner Mongolia to the south — the scattered children of the great steppe returning to the fold. Genghis Khan built his empire in twenty years. We are in no particular hurry. We will take whatever time we need."

  # Path 1 new focuses
 MON_nkvd_advisors_arrive:0 "NKVD Advisors Arrive"
 MON_nkvd_advisors_arrive_desc:0 "Soviet NKVD officers have arrived in Ulaanbaatar quietly and without fanfare. They have set up offices in a building near the Interior Ministry that nobody is allowed to enter without an appointment and nobody who enters seems eager to discuss afterward. Their stated purpose is to assist with internal security. Their actual purpose is understood by everyone and discussed by no one."

 MON_destroy_the_monasteries:0 "Destroy the Monasteries"
 MON_destroy_the_monasteries_desc:0 "The Buddhist monasteries of Mongolia have been declared centres of counter-revolutionary activity. Soviet pressure and ideological orthodoxy demand their destruction. Hundreds of monasteries that have stood for centuries are being demolished, their libraries burned and their monks arrested, executed or forced to renounce their vows. It is the most violent act of cultural destruction in Mongolian history and it is happening in the name of progress."

 MON_choibalsan_inner_circle:0 "Choibalsan's Inner Circle"
 MON_choibalsan_inner_circle_desc:0 "Choibalsan has gathered around him a tight circle of loyal subordinates — men who owe their positions entirely to him and who know their fortunes are bound to his. They are not the most talented men in Mongolia. They are the most loyal and in the current political climate that counts for considerably more."

 MON_party_propaganda_apparatus:0 "Party Propaganda Apparatus"
 MON_party_propaganda_apparatus_desc:0 "A comprehensive state propaganda apparatus has been established under party control. Newspapers, radio broadcasts, public art and school curricula all carry the same message — the party is wise, the Soviet Union is Mongolia's greatest friend and counter-revolutionary thoughts are a symptom of a diseased mind that needs treatment. The treatment is not pleasant."

 MON_peoples_militia:0 "The People's Militia"
 MON_peoples_militia_desc:0 "A party controlled peoples militia has been established to supplement the regular army and the secret police. Its members are drawn from the most ideologically reliable elements of Mongolian society — young party members, factory workers and collective farm administrators who report suspicious behaviour in their communities and stand ready to enforce party discipline at the local level."

 MON_red_army_joint_exercises:0 "Red Army Joint Exercises"
 MON_red_army_joint_exercises_desc:0 "Mongolian and Soviet forces have begun conducting joint military exercises along the eastern border. The exercises are officially defensive in nature and aimed at deterring Japanese aggression. They are also an excellent opportunity for Soviet commanders to assess the capabilities and reliability of the Mongolian armed forces and to identify which Mongolian officers can be trusted and which require further ideological development."

 MON_border_fortifications_east:0 "Eastern Border Fortifications"
 MON_border_fortifications_east_desc:0 "The Mongolian eastern border facing Japanese controlled Manchuria is being systematically fortified. Bunkers, observation posts and defensive lines are being constructed with Soviet engineering assistance. The Japanese have taken notice and their own border units have increased their activity in response. The steppe is quiet but the quiet has the particular quality of something that is about to stop being quiet."

 MON_soviet_economic_integration:0 "Soviet Economic Integration"
 MON_soviet_economic_integration_desc:0 "Mongolia's economy is being progressively integrated into the Soviet economic system. Mongolian raw materials — wool, livestock, minerals — flow north into the USSR and Soviet manufactured goods flow south into Mongolia. It is an arrangement that benefits both parties if you accept the Soviet definition of benefit which Mongolia is increasingly not in a position to question."

 MON_party_controls_the_army:0 "The Party Controls the Army"
 MON_party_controls_the_army_desc:0 "Political commissars have been embedded at every level of the Mongolian military. No operational decision of significance can be made without party approval. Officers who question the system have been replaced by officers who do not question the system. The army is politically reliable. Whether it is militarily effective is a secondary concern."

 # Path 2 new focuses
 MON_genden_addresses_the_nation:0 "Genden Addresses the Nation"
 MON_genden_addresses_the_nation_desc:0 "Genden has taken to the radio to address the Mongolian people directly. He speaks clearly and without the usual party jargon about what Mongolia is, what it is not and what he intends it to become. He does not mention Stalin by name. He does not need to. Everyone in Mongolia understands exactly who he is talking about and exactly what he is refusing. The broadcast is heard in silence in homes across the country and discussed in whispers afterwards."

 MON_protect_the_monasteries:0 "Protect the Monasteries"
 MON_protect_the_monasteries_desc:0 "Unlike his Soviet backed rivals Genden has refused to order the destruction of Mongolia's Buddhist monasteries. He views them not as counter-revolutionary institutions but as living repositories of Mongolian culture and identity. The monks are cautious but grateful. The Soviet advisors are furious. Genden has pointed out that the monasteries were here before communism and will be here after the current political fashion has passed."

 MON_mongolian_red_guard:0 "The Mongolian Red Guard"
 MON_mongolian_red_guard_desc:0 "To replace the Soviet loyalists purged from the army Genden has established the Mongolian Red Guard — a political and military organisation loyal specifically to the Mongolian party leadership rather than to Moscow. Its members are screened carefully for genuine Mongolian communist conviction rather than Soviet allegiance. It is a subtle but crucial distinction."

 MON_reach_out_to_china:0 "Reach Out to China"
 MON_reach_out_to_china_desc:0 "With Soviet relations deteriorating Genden has opened discreet diplomatic channels with the Chinese nationalist government. It is an unlikely partnership — Mongolia fought for independence from China not long ago — but shared concerns about Japanese expansion and shared interest in Soviet containment create unexpected common ground. The conversations are preliminary and both sides are suspicious but the channel is open."

 MON_anti_japanese_coalition:0 "Anti-Japanese Coalition"
 MON_anti_japanese_coalition_desc:0 "Japan is the immediate threat to Mongolian sovereignty and Genden is willing to work with anyone who shares that concern — including people Moscow would prefer he not talk to. A loose anti-Japanese coalition of Mongolian, Chinese and potentially western interests is being quietly assembled. It will not have Soviet blessing. Genden has decided he can live with that."

 MON_buddhist_socialist_synthesis:0 "Buddhist-Socialist Synthesis"
 MON_buddhist_socialist_synthesis_desc:0 "Mongolia is attempting something genuinely unprecedented — a synthesis of Buddhist philosophy and socialist economics that preserves both the spiritual traditions of the Mongolian people and the egalitarian economic ambitions of the revolutionary government. It horrifies orthodox Marxists. It satisfies the monks. Genden considers this a reasonable trade."

 MON_pastoral_collectivization:0 "Pastoral Collectivisation"
 MON_pastoral_collectivization_desc:0 "Genden's approach to collectivising Mongolia's pastoral economy is radically different from the Soviet model. Rather than forcing nomads into fixed collective farms the government is creating mobile collective units that follow the traditional seasonal migration routes. The herds stay healthy. The herders stay free. Production actually increases. Several Soviet agricultural planners have visited and left looking deeply confused."

 MON_nomadic_socialism:0 "Nomadic Socialism"
 MON_nomadic_socialism_desc:0 "Mongolia has developed a uniquely nomadic approach to socialist society. Collective ownership, shared resources and communal decision making — but all practiced within the framework of the traditional ger camp rather than the Soviet factory or collective farm. It is socialism that smells of horses and tastes of airag and it works in ways that no foreign theorist predicted."

 MON_genden_military_reform:0 "Genden's Military Reform"
 MON_genden_military_reform_desc:0 "With Soviet advisors gone Genden has reformed the Mongolian military along genuinely independent lines. Officers are promoted on merit and loyalty to Mongolia rather than loyalty to Moscow. Doctrine is developed from Mongolian experience and conditions rather than copied from Red Army manuals. The army that emerges is smaller than what the Soviets would have built but it is authentically Mongolian and it fights for Mongolia."

 # Path 3 new focuses
 MON_british_trade_agreement:0 "British Trade Agreement"
 MON_british_trade_agreement_desc:0 "Mongolia has signed a preliminary trade agreement with Britain — the first formal economic relationship with a major western power in Mongolian history. The British are primarily interested in Mongolian wool and mineral resources. Mongolia is primarily interested in British recognition, British manufactured goods and the implicit security guarantee that comes from being on speaking terms with the British Empire. Both sides consider the arrangement satisfactory."

 MON_american_recognition:0 "American Recognition"
 MON_american_recognition_desc:0 "The United States has formally recognised Mongolia as a sovereign independent nation. It is largely symbolic — America has no particular strategic interest in the Mongolian steppe — but symbolism matters enormously for a small nation trying to establish its place in the world. The Mongolian press has described it as a historic moment. The American press has mostly not mentioned it. Mongolia is choosing to focus on its own reaction."

 MON_western_military_observers:0 "Western Military Observers"
 MON_western_military_observers_desc:0 "British and French military observers have arrived in Ulaanbaatar to assess the Mongolian armed forces. Their reports to their respective governments are cautiously positive — the Mongolian soldier is tough, the terrain is defensible and with proper training and equipment Mongolia could be a useful factor in any regional balance of power calculation. Mongolia is choosing to interpret this as a compliment."

 MON_multiparty_system:0 "Establish a Multiparty System"
 MON_multiparty_system_desc:0 "Mongolia's first genuine political parties have been registered and are competing for public support. It is chaotic, occasionally absurd and frequently very loud. Three parties have already split into factions. One faction has split into two further factions over a disagreement about whether democracy requires everyone to agree about what democracy means. The process is working exactly as intended."

 MON_civil_liberties_act:0 "Civil Liberties Act"
 MON_civil_liberties_act_desc:0 "The new Mongolian constitution has been supplemented by a comprehensive Civil Liberties Act enshrining freedom of speech, freedom of assembly, freedom of religion and protection from arbitrary arrest. Several members of the drafting committee who spent time in Soviet custody insisted on the last one with particular emphasis. The act has been passed unanimously. Mongolia is taking its democracy seriously."

 MON_separation_of_church_and_state:0 "Separation of Church and State"
 MON_separation_of_church_and_state_desc:0 "The new democratic Mongolia formally separates the Buddhist religious establishment from the apparatus of the state. The monasteries are protected and respected but they do not govern. The government is secular but it does not persecute. It is a delicate balance that satisfies nobody completely and everybody sufficiently. This is, the constitutional committee notes, broadly the definition of successful democratic compromise."

 MON_democratic_economic_policy:0 "Democratic Economic Policy"
 MON_democratic_economic_policy_desc:0 "The newly elected parliament has passed its first economic legislation — a mixed economy framework that combines private enterprise, cooperative ownership and state investment in a structure designed to modernise Mongolia without repeating the extremes of either Soviet collectivisation or unregulated capitalism. The debate lasted three weeks. The final vote was close. The result is workable."

 MON_western_investment:0 "Western Investment"
 MON_western_investment_desc:0 "British and American capital is beginning to flow into Mongolia attracted by the democratic government's stable property rights, mineral wealth and openness to foreign business. Mines are being developed, infrastructure funded and technical expertise imported. It is not the independence that the nationalists wanted but it is development that Mongolia could not have achieved alone."

 # Path 4 new focuses
 MON_restore_the_monasteries:0 "Restore the Monasteries"
 MON_restore_the_monasteries_desc:0 "The monasteries that the Soviet backed government damaged or threatened will be restored and protected. Buddhism is not merely a religion in Mongolia — it is the spiritual spine of Mongolian civilisation and a nationalist government that fails to protect it has misunderstood what it is supposed to be nationalist about. The monks are returning. The great centres of Mongolian spiritual life are reopening. The steppe exhales."

 MON_national_mongol_identity_program:0 "National Mongol Identity Program"
 MON_national_mongol_identity_program_desc:0 "The government has launched a comprehensive program to rebuild and strengthen Mongolian national identity after decades of Soviet cultural interference. History is being rewritten — accurately this time. Traditional arts, music and customs are being promoted and funded. Being Mongolian is not merely a fact of birth but an active identity that the state is committed to nurturing and celebrating."

 MON_traditional_script_restored:0 "Traditional Script Restored"
 MON_traditional_script_restored_desc:0 "The traditional Mongolian vertical script — suppressed by the Soviet backed government in favour of Cyrillic — is being restored as the official writing system of the Mongolian state. It is technically demanding to print and difficult for those educated in Cyrillic to learn but it is genuinely Mongolian in a way that borrowed alphabets are not. Every government document will now be written in a script that Genghis Khan's secretaries would have recognised."

 MON_mongol_history_in_schools:0 "Mongolian History in Schools"
 MON_mongol_history_in_schools_desc:0 "The school curriculum has been completely overhauled. Where Soviet ideology once dominated every subject Mongolian history now takes centre stage. Children learn about the great khans, the Mongol Empire, the resistance to Chinese and Russian domination and the long struggle for independence. A generation that knows what Mongolia was will understand what Mongolia can be again."

 MON_nationalist_economic_policy:0 "Nationalist Economic Policy"
 MON_nationalist_economic_policy_desc:0 "Mongolia's economy will be developed for Mongolians by Mongolians. Foreign ownership of Mongolian resources is being curtailed. State enterprises are replacing foreign controlled operations. The profits of the steppe will flow into Mongolian pockets rather than disappearing across the border into Soviet or foreign corporate accounts. It will slow development in the short term. The government considers this an acceptable price for genuine economic sovereignty."

 MON_mongol_autarky:0 "Mongolian Autarky"
 MON_mongol_autarky_desc:0 "Mongolia will be as self sufficient as the steppe allows. Critical industries will be domestically owned, food production will be nationally managed and the dependence on Soviet supplied manufactured goods will be systematically reduced. It is an ambitious goal for a landlocked nation of under a million people but ambition has never been in short supply on the steppe."

 MON_steppe_resources_for_mongols:0 "Steppe Resources for Mongols"
 MON_steppe_resources_for_mongols_desc:0 "The mineral wealth beneath the Mongolian steppe has been exploited by others for long enough. Soviet advisors extracted resources under arrangements that benefited Moscow far more than Ulaanbaatar. Those arrangements are over. Every mine, every deposit and every vein of ore beneath Mongolian soil now belongs to the Mongolian people and will be developed at the pace and in the manner that suits Mongolia rather than any foreign power."

 MON_cavalry_revival:0 "Revival of the Cavalry"
 MON_cavalry_revival_desc:0 "The horse is the soul of Mongolia. For a thousand years Mongolian military power was mounted power and the nationalist government intends to honour that tradition. Elite cavalry units are being expanded and re-equipped — not to replace modern arms but to complement them. Mongolian cavalry operating in the steppe terrain they were born in remains a formidable military asset that no foreign military planner should dismiss."

 MON_warrior_tradition:0 "The Warrior Tradition"
 MON_warrior_tradition_desc:0 "Every Mongolian man is raised in the warrior tradition — riding, archery and the physical toughness that the steppe demands. The nationalist government is formalising and celebrating that tradition through mandatory military training, national sports competitions based on traditional warrior skills and an officer corps that prizes practical battlefield ability over political reliability. Mongolia is remembering how to fight like Mongolia."

 MON_monastic_population_idea:0 "Monastic Population"
 MON_monastic_population_idea_desc:0 "A significant portion of Mongolia`s male population resides within Buddhist monasteries rather than participating in agricultural or military life. While the monasteries provide spiritual guidance and social stability, they also reduce the manpower available for national mobilization."

 MON_monasteries_desecration_idea:0 "Desecrated Monasteries"
 MON_monasteries_desecration_idea_desc:0 "The government`s campaign against Buddhist institutions has shaken Mongolia to its core. Monasteries have been closed, religious artifacts destroyed, and countless monks persecuted in the name of revolutionary reform. While the state tightens its control, the social and spiritual scars of the crackdown remain deep."