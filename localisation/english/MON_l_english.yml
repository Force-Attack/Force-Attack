 MON_mechanized_infantry:0 "Mechanized Infantry"
 MON_light_armor_brigades:0 "Light Armor Brigades"
 MON_medium_armor_push:0 "Medium Armor Push"
 MON_steppe_blitzkrieg:0 "Steppe Blitzkrieg"
 MON_armored_spearhead:0 "Armored Spearhead"
 MON_iron_horde_reborn:0 "Iron Horde Reborn"

 # ========================
 # FOCUS DESCRIPTIONS
 # ========================

 MON_forge_the_mongol_army_desc:0 "The armies of Mongolia are the inheritors of the greatest conquering force the world has ever known. But the modern world demands more than tradition alone. We must reorganize, retrain, and re-equip our forces if we are to stand as a sovereign nation on the steppes. The question is: do we look to our past for inspiration, or to the future?"

 MON_sons_of_the_steppe_desc:0 "Our ancestors conquered half the world with discipline, endurance, and an intimate knowledge of the land. The sons of the steppe do not need iron machines to be feared — they need only strong backs, sharp blades, and the will to fight. We will build our army on these ancient virtues."

 MON_iron_horde_desc:0 "The age of the horse archer is over. The next great war will be won by steel, oil, and firepower. Mongolia must embrace mechanization and armor if we are to project power across the vast steppes of Central Asia. We will forge an iron horde worthy of the modern age."

 MON_mongol_infantry_training_desc:0 "Our infantrymen are tough and resilient, but they need proper training with modern weapons. By establishing dedicated infantry training programs, we can ensure every soldier knows how to handle their rifle and fight effectively in a modern engagement."

 MON_riders_of_the_plains_desc:0 "The cavalry of Mongolia has always been our greatest strength. The steppe is our domain, and a Mongol rider knows the land better than any map can show. We will invest in our cavalry arm, equipping them with the best horses and weapons available."

 MON_hardened_footsoldiers_desc:0 "Through rigorous training and harsh field exercises, we will temper our infantry into something truly fearsome. A Mongol footsoldier who has marched a hundred miles through biting wind and frozen ground is worth ten soldiers from a soft nation."

 MON_mountain_warfare_desc:0 "The Altai and Khangai mountains form a natural barrier, but also a battlefield. By training specialized mountain troops, we can both defend these heights and use them as launching points for offensive operations into neighboring territories."

 MON_cavalry_doctrine_desc:0 "War on horseback is as much an art as a science. We will develop formal cavalry doctrines based on the ancient strategies of our forefathers, combined with modern tactical thinking. Our riders will be disciplined, coordinated, and devastating."

 MON_art_of_the_siege_desc:0 "Genghis Khan was not only a master of mobile warfare — he was also a brilliant besieger of cities. We will develop our artillery arm so that no wall can stop us and no fortress can stand against the Mongol horde."

 MON_elite_infantry_corps_desc:0 "Drawing the finest warriors from every regiment, we will forge an elite infantry corps answerable only to the high command. These soldiers will be equipped with the best weapons we have and trained to accomplish missions no ordinary unit could attempt."

 MON_great_ride_desc:0 "We will undertake a massive cavalry exercise across the entire breadth of Mongolia — a symbolic and practical demonstration of our ability to project mobile force rapidly across the steppe. Word of the Great Ride will spread to our neighbors."

 MON_legacy_of_genghis_desc:0 "We have walked the path of our ancestors and found it worthy. Our army is now a true inheritor of the legacy of Genghis Khan — disciplined, mobile, and hardened by the steppe. Let our enemies tremble at the thunder of our boots and hooves."

 MON_motorized_divisions_desc:0 "The horse is fast, but the truck is faster over long distances and does not tire. By motorizing our infantry, we gain the ability to rapidly redeploy forces across the vast Mongolian steppe, achieving the same strategic mobility our ancestors had — but faster."

 MON_armored_vanguard_desc:0 "Tanks are the battering rams of the modern age. By investing in armor, Mongolia gains the ability to punch through enemy lines and exploit breakthroughs in a way that cavalry simply cannot match in the face of modern firepower."

 MON_soviet_trucks_desc:0 "Our northern neighbor produces trucks in vast quantities. Through careful diplomacy and trade arrangements, we can acquire Soviet-pattern trucks to form the logistical backbone of our motorized forces. What our industry cannot yet build, we will purchase."

 MON_mechanized_infantry_desc:0 "Infantry riding in armored carriers can keep pace with tanks, providing them with protection against enemy infantry while the armor deals with fortifications and vehicles. We will develop proper mechanized infantry doctrine and equipment."

 MON_light_armor_brigades_desc:0 "Light tanks are fast, reliable, and well-suited to the open terrain of the steppe. We will form dedicated light armor brigades capable of rapid exploitation and reconnaissance, harassing enemy flanks and disrupting their supply lines."

 MON_medium_armor_push_desc:0 "As our armored forces mature, we must invest in heavier medium tanks capable of engaging enemy armor directly. A balanced force of light and medium tanks will give us the flexibility to handle any situation on the battlefield."

 MON_steppe_blitzkrieg_desc:0 "We have combined the speed of motorized infantry with hard-hitting mechanized units. Now we will develop the doctrine to use them together — a Mongolian style of blitzkrieg, as fast and merciless as the original hordes that swept across Eurasia centuries ago."

 MON_armored_spearhead_desc:0 "Our tank arm is now a powerful and coherent force. We will organize it into dedicated armored divisions capable of acting as the spearhead for major offensives, smashing through enemy lines and driving deep into their rear areas before they can react."

 MON_iron_horde_reborn_desc:0 "We have done what once seemed impossible — we have taken the spirit of the ancient Mongol horde and encased it in steel. Our armored divisions and mechanized infantry are a modern marvel, combining the shock and speed of the old with the firepower of the new. The Iron Horde is reborn."

