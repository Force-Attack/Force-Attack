 MON_armored_spearhead_idea:0 "Armored Spearhead Doctrine"
 MON_iron_horde_reborn_idea:0 "Iron Horde Reborn"

 # ========================
 # NATIONAL SPIRIT / IDEA DESCRIPTIONS
 # ========================

 MON_military_reorganization_desc:0 "The Mongolian military is undergoing a fundamental restructuring. Though disruptive in the short term, this reorganization will produce a far more effective fighting force in the long run."

 MON_traditional_warrior_spirit_desc:0 "The Mongol soldier draws strength from centuries of martial tradition. This unshakeable warrior spirit gives our infantry and cavalry an edge in morale and endurance that training alone cannot provide."

 MON_modern_warfare_doctrine_desc:0 "Our officers and commanders are studying modern warfare theory and developing new doctrines suited to mechanized and armored combat on the steppe."

 MON_hardened_infantry_spirit_desc:0 "Our infantry have been through the crucible. They march further, fight longer, and hold harder than men from softer nations. This endurance gives our divisions exceptional staying power in prolonged engagements."

 MON_cavalry_masters_desc:0 "Generations of riding have produced the finest cavalry in the region. Mongol riders can cover ground at a speed that dumbfounds enemy commanders and strikes at targets they believed were safe."

 MON_elite_corps_idea_desc:0 "An elite corps of highly trained infantry stands ready to be committed at the decisive moment of battle. Their presence stiffens the resolve of nearby units and their skill makes them worth far more than their numbers suggest."

 MON_great_ride_spirit_desc:0 "The memory of the Great Ride — a thundering sweep of cavalry across the entire steppe — has become legend within our army and terrified our neighbors. Our cavalry moves with inspired confidence."

 MON_legacy_of_genghis_idea_desc:0 "We have fully embraced the military legacy of the Great Khan. Our army embodies the qualities that made the original Mongol horde unstoppable: mobility, discipline, adaptability, and an absolute will to conquer."

 MON_steppe_blitz_idea_desc:0 "Our commanders have developed a distinctive brand of high-speed armored warfare optimized for the open terrain of the Mongolian steppe. Enemy lines will crumble before the speed and violence of our attacks."

 MON_armored_spearhead_idea_desc:0 "Our armored divisions have been drilled to act as a coordinated spearhead. When given the order to attack, they concentrate their firepower at a single point and drive through, exploiting the gap before the enemy can respond."

 MON_iron_horde_reborn_idea_desc:0 "Mongolia fields a mechanized and armored force that would astonish any observer who remembered the poverty of our military a decade ago. The Iron Horde is real, and the steppe belongs to us again."

