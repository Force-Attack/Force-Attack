l_english:

 # Root
 MON_modernize_the_economy:0 "Modernise the Economy"
 MON_modernize_the_economy_desc:0 "Mongolia stands at a crossroads. For centuries our people have lived as nomads on the great steppe, following the herds and the seasons in the tradition of our ancestors. But the modern world does not wait for tradition. If Mongolia is to survive and prosper in the coming century we must industrialise, modernise and build an economy capable of supporting a modern state and a modern army. The work begins today."

 # Industry Branch
 MON_develop_ulaanbaatar:0 "Develop Ulaanbaatar"
 MON_develop_ulaanbaatar_desc:0 "Ulaanbaatar is the heart of Mongolia and it must be made worthy of that role. Investment in factories, housing and urban infrastructure will transform our capital from a sprawling camp into a true industrial city capable of driving the national economy forward."

 MON_exploit_mineral_wealth:0 "Exploit Mineral Wealth"
 MON_exploit_mineral_wealth_desc:0 "The Mongolian steppe sits atop one of the richest mineral deposits in Asia. Coal, iron, copper and rare metals lie beneath the soil in quantities that could make Mongolia a significant industrial power if properly extracted. We shall invest in the mines and the men needed to bring that wealth to the surface."

 MON_coal_mining_expansion:0 "Expand Coal Mining"
 MON_coal_mining_expansion_desc:0 "Coal is the fuel of industry and Mongolia has it in abundance. Expanding our mining operations will provide the energy needed to power the factories, railways and cities of a modern Mongolian state and reduce our dependence on imported fuel from our neighbours."

 MON_steel_foundries:0 "Build Steel Foundries"
 MON_steel_foundries_desc:0 "Steel is the skeleton of modern industry. Without it there are no factories, no railways and no modern army. We shall construct dedicated steel foundries to process our abundant iron ore into the structural material that every other aspect of our modernisation program depends upon."

 MON_industrial_heartland:0 "Create an Industrial Heartland"
 MON_industrial_heartland_desc:0 "Scattered mines and foundries are not enough. Mongolia needs a concentrated industrial heartland — a region where factories, mines, foundries and workers are clustered together in a self reinforcing engine of production. We shall build it from the ground up and make it the beating heart of the Mongolian economy."

 MON_industry_tech_bonus:0 "Industrial Research Program"
 MON_industry_tech_bonus_desc:0 "Our growing industrial base has created both the need and the capacity for serious industrial research. Engineers and technicians are being trained, laboratories established and foreign technical manuals translated. Mongolia is learning the science of industry as fast as it is building it."

 MON_second_industry_tech_bonus:0 "Industrial Mastery"
 MON_second_industry_tech_bonus_desc:0 "Mongolia's engineers and factory managers have moved beyond merely copying foreign methods. They are beginning to innovate — finding solutions specific to Mongolian conditions, resources and needs. The industrial revolution is no longer something happening to Mongolia. It is something Mongolia is doing for itself."

 MON_five_year_industrialization:0 "Five Year Industrialisation Plan"
 MON_five_year_industrialization_desc:0 "The state has committed to the most ambitious economic program in Mongolian history — a comprehensive five year plan to industrialise the entire country. Production targets have been set, resources allocated and every ministry mobilised behind a single goal. In five years Mongolia will be unrecognisable. The steppe will have factories. The nomads will have wages. The future has arrived."

 # Centre Branch
 MON_trans_mongolian_railway:0 "Trans-Mongolian Railway"
 MON_trans_mongolian_railway_desc:0 "A railway connecting Mongolia's major cities and linking us to our neighbours is the single most important piece of infrastructure we can build. It will carry coal from the mines, steel from the foundries, soldiers from the barracks and goods from the factories to every corner of the country. Without it Mongolia remains a collection of isolated settlements. With it we become a nation."

 MON_road_network:0 "National Road Network"
 MON_road_network_desc:0 "The railway connects our cities but the roads connect our people. A comprehensive national road network will bring the most remote corners of the steppe within reach of the modern economy — allowing goods, workers and ideas to flow freely across the country for the first time in our history."

 MON_develop_the_steppe:0 "Develop the Steppe"
 MON_develop_the_steppe_desc:0 "The great Mongolian steppe is not empty land — it is potential waiting to be realised. Systematic development of the steppe regions, including new towns, agricultural facilities and industrial outposts, will spread Mongolia's economic growth beyond the capital and into the heartland of our nation."

 MON_ulaanbaatar_expansion:0 "Expand Ulaanbaatar"
 MON_ulaanbaatar_expansion_desc:0 "Ulaanbaatar is growing faster than anyone anticipated. Workers flood in from the countryside, drawn by factory wages and urban opportunities. We shall expand the city to meet them — new districts, new factories and new infrastructure to house and employ the workforce that our industrialisation program is creating."

 MON_national_construction_program:0 "National Construction Program"
 MON_national_construction_program_desc:0 "The state has launched a coordinated national construction program bringing together every available engineer, builder and labourer behind a unified building effort. Factories, roads, railways and public buildings are rising across Mongolia simultaneously. It is the most ambitious construction effort in our history and it is ahead of schedule."

 MON_worker_training:0 "Worker Training Program"
 MON_worker_training_desc:0 "A factory is only as good as the workers inside it. Mongolia has no shortage of willing hands but it has a shortage of skilled ones. A comprehensive worker training program will teach our people the technical skills that modern industry demands — from operating machinery to managing production lines to maintaining complex equipment."

 # Electronics Branch
 MON_modernize_communications:0 "Modernise Communications"
 MON_modernize_communications_desc:0 "A modern state cannot function without modern communications. Telegraph lines, telephone exchanges and radio stations will connect our government, our military and our economy into a single coherent network. Information will flow as freely as goods and Mongolia will be able to respond to events at the speed of electricity rather than the speed of a horse."

 MON_radio_broadcasting:0 "National Radio Broadcasting"
 MON_radio_broadcasting_desc:0 "Radio reaches where telephone lines do not and Mongolia is a very large country with a great deal of steppe between its settlements. A national radio broadcasting service will carry the voice of the government, the news of the world and the culture of the Mongolian people to every ger and every village across the nation."

 MON_university_of_ulaanbaatar:0 "University of Ulaanbaatar"
 MON_university_of_ulaanbaatar_desc:0 "Mongolia needs its own scientists, engineers and technicians — men and women trained here, committed to here and focused on solving Mongolia's specific problems. The University of Ulaanbaatar will be the institution that produces them. It will be small at first. It will not stay small."

 MON_electronics_industry:0 "Electronics Industry"
 MON_electronics_industry_desc:0 "Building on our communications infrastructure and university research, Mongolia will establish a domestic electronics industry. It will begin with assembly and maintenance of imported components but the goal is clear — a Mongolia capable of designing and manufacturing its own electronic equipment for military and civilian use."

 MON_second_electronics_tech_bonus:0 "Dam The Selenge River"
 MON_second_electronics_tech_bonus_desc:0 "The Selenge river located in northern Mongolia flowing into the Khangal Mountains. This river is vital to making sure our new electricity grid is powered.

 MON_research_institutions:0 "National Research Institutions"
 MON_research_institutions_desc:0 "A single university is not enough for an ambitious nation. Mongolia will establish a network of dedicated research institutions — each focused on a specific area of scientific and technical development. From metallurgy to electronics to military technology, Mongolian researchers will have the facilities and the funding to pursue excellence in every field that matters to our national development."

 # Convergence
 MON_mongolian_economic_miracle:0 "The Mongolian Economic Miracle"
 MON_mongolian_economic_miracle_desc:0 "In a generation Mongolia has gone from nomadic herders to industrial producers. From telegraph poles strung across empty steppe to electronics laboratories producing equipment that rivals anything in Asia. From a single railway line to a national network of roads, rails and communications. The world did not expect this. Our neighbours did not expect this. We always knew it was possible. The Mongolian economic miracle is not a miracle at all. It is the result of a nation that decided it was done being small and did something about it."